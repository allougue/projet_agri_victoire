{% extends "base.html" %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 py-14">
<h1 class="text-3xl font-black">Mes produits</h1>
<div class="mt-8 grid md:grid-cols-3 gap-5">
{% for produit in produits %}
<div class="bg-white border rounded-2xl overflow-hidden">
<img src="{{ produit.image_principale.url }}" class="w-full h-48 object-cover">
<div class="p-5"><h2 class="font-bold text-xl">{{ produit.nom }}</h2><p class="text-gray-500 mt-1">{{ produit.stock }} {{ produit.unite }}</p>
<form method="post" action="{% url 'supprimer_produit' produit.id %}" class="mt-4">{% csrf_token %}<button class="text-red-600">Supprimer</button></form>
</div></div>
{% empty %}<p>Aucun produit publié.</p>{% endfor %}
</div></section>
{% endblock %}
