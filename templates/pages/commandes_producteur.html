{% extends "base.html" %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 py-14">
<h1 class="text-3xl font-black">Commandes reçues</h1>
<div class="mt-8 space-y-4">
{% for commande in commandes %}
<div class="bg-white border rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
<div><strong>Commande #{{ commande.id }}</strong><p class="text-gray-500">{{ commande.client.username }} — {{ commande.total }} FCFA</p></div>
<form method="post" action="{% url 'modifier_statut_commande' commande.id %}" class="flex gap-2">{% csrf_token %}<select name="statut" class="border rounded-lg p-2">{% for code,label in commande.STATUTS %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select><button class="bg-agriculture-600 text-white rounded-lg px-4">Mettre à jour</button></form>
</div>
{% empty %}<p>Aucune commande reçue.</p>{% endfor %}
</div></section>
{% endblock %}
